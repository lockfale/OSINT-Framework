name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Run link check weekly on Saturday at 08:00 UTC
    - cron: '0 8 * * 6'
  # Manual run of the link check from the Actions tab
  workflow_dispatch:

jobs:
  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate arf.json is well-formed
        run: python3 -m json.tool public/arf.json > /dev/null

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check index.html local asset references exist
        run: |
          check_asset() {
            local path="public/$1"
            if [ ! -f "$path" ]; then
              echo "MISSING: $path"
              exit 1
            else
              echo "OK: $path"
            fi
          }
          check_asset "css/arf.css"
          check_asset "js/d3.min.js"
          check_asset "js/arf.js"
          check_asset "arf.json"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    # Only run on schedule (weekly Saturday) or by hand, to avoid hammering external sites on every push/PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract URLs from arf.json (skipping template URLs)
        run: python3 tools/extract_urls.py

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --no-progress
            --timeout 20
            --max-retries 2
            --retry-wait-time 5
            --accept 200,201,204,206,301,302,307,308,403,429
            urls.txt
          format: json
          output: lychee/out.json
          # Failures get a second look in a real browser below, which decides
          # whether the job fails.
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        working-directory: tools/link-recheck
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Recheck lychee failures in headless Chromium
        working-directory: tools/link-recheck
        run: node recheck.mjs ../../lychee/out.json ../../link-recheck-report.md

      - name: Upload link check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            lychee/out.json
            link-recheck-report.md
